name: matrix-windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: script/voice/requirements-build.txt

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Install Matrix Voice build dependencies
        run: python -m pip install -r script/voice/requirements-build.txt

      - name: Build Windows distributions
        shell: pwsh
        run: ./script/build-windows-distribution.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matrix-code-windows-x64
          path: |
            packages/opencode/dist/matrix-release/Matrix-Code-Windows-x64.zip
            packages/opencode/dist/matrix-release/Matrix-Code-Windows-x64-Portable.zip
            packages/opencode/dist/matrix-release/SHA256SUMS.txt

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --generate-notes --title "Matrix Code $tag"
          }
          gh release upload $tag `
            packages/opencode/dist/matrix-release/Matrix-Code-Windows-x64.zip `
            packages/opencode/dist/matrix-release/Matrix-Code-Windows-x64-Portable.zip `
            packages/opencode/dist/matrix-release/SHA256SUMS.txt `
            --clobber
